<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Optimizarte - WhatsApp</title>

  <!-- Redirección ultrarrápida al nuevo WhatsApp -->
  <script>
    // Intento inmediato de salto nativo a la app
    window.location.href = "whatsapp://send?phone=34972426665&text=Hola";
    
    // Respaldo inmediato vía web si no tiene la app instalada
    setTimeout(function() {
      window.location.href = "https://wa.me/34972426665?text=Hola";
    }, 400);
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      /* 100dvh compensa la barra de navegación inferior de Chrome móvil */
      height: 100dvh;
      background-color: #0b141a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 16px;
    }
    .text-invite {
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .btn-link {
      display: block;
      width: 100%;
      max-width: 380px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease;
    }
    .btn-link:active {
      transform: scale(0.97);
    }
    .btn-img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <p class="text-invite">Pulsa en el botón para iniciar conversación:</p>
    
    <a class="btn-link" href="https://wa.me/34972426665?text=Hola">
      <!-- Asegúrate de que el nombre del archivo de imagen coincide con el que tienes en el repo -->
      <img class="btn-img" src="botonwhatssendpulseplan.jpg" alt="Abrir WhatsApp">
    </a>
  </div>

</body>
</html>
